name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get install -y cmake g++ libgtest-dev

      - name: Build GTest
        run: |
          cd /usr/src/gtest
          sudo cmake . -DCMAKE_BUILD_TYPE=Release
          sudo make
          sudo cp lib/*.a /usr/lib/ 2>/dev/null || sudo cp *.a /usr/lib/ 2>/dev/null || true

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Run tests
        run: |
          if [ -f build/test_nn ]; then
            build/test_nn
          else
            echo "Tests skipped (GTest not linked)"
          fi

      - name: Benchmark smoke test
        run: build/benchmark

      - name: Download MNIST
        run: bash scripts/download_mnist.sh

      # This is the check that would have caught the real bug this project shipped
      # with for months: MLP::backward() called relu.backward(grad, {}) with an
      # empty placeholder matrix instead of the real cached input, which segfaulted
      # on the very first training step in Release builds. The unit tests above all
      # passed the whole time because none of them drove the actual training path —
      # only this does. Two epochs is enough to both crash (if it's going to) and
      # cross a real accuracy floor (if it's actually learning), in well under a
      # minute, so this runs on every push instead of only the full 20-epoch job.
      - name: Train smoke test (2 epochs on real MNIST)
        run: |
          build/train data/mnist 2 | tee /tmp/train_log.txt
          test_acc=$(grep -oE 'test_acc=[0-9.]+' /tmp/train_log.txt | tail -1 | cut -d= -f2)
          echo "Final test accuracy after 2 epochs: ${test_acc}%"
          awk -v acc="$test_acc" 'BEGIN { exit !(acc > 90) }' || {
            echo "::error::Test accuracy ${test_acc}% did not clear the 90% floor after 2 epochs"
            exit 1
          }
